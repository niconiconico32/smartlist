# E2E handoff – apertura 1: abre el deep link, hace login si procede y verifica
# que se llega a /plan-ready. Los valores se inyectan por env (nunca en el repo).
#   BRAINY_E2E_OPEN_URL     deep link exacto a abrir (lo construye el runner)
#   BRAINY_TEST_EMAIL       email del usuario de prueba
#   BRAINY_TEST_PASSWORD    password del usuario de prueba
appId: com.brainyahdh.app
---
# 1) Abrir el link (brainy://claim?token=...&redeem_url=... o la rc-:// link)
- openLink: ${BRAINY_E2E_OPEN_URL}

# 2) Si el app pidió login (sin sesión real), entrar por el modal de email.
#    Tras un arranque en frío el bundler puede tardar bastante en mostrar la
#    welcome screen, así que se espera loginEmailOpen con margen amplio.
- extendedWaitUntil:
    visible:
      id: loginEmailOpen
    timeout: 180000
- assertVisible:
    id: loginEmailOpen
- tapOn:
    id: loginEmailOpen
- extendedWaitUntil:
    visible:
      id: loginEmailInput
    timeout: 15000
- tapOn:
    id: loginEmailInput
- inputText: ${BRAINY_TEST_EMAIL}
# El modal es OTP-first: hay que togglear a "usar contraseña" antes de que
# exista loginPasswordInput. El runner crea el usuario con password, así el
# login no depende de leer un OTP por correo.
- tapOn:
    id: loginPasswordToggle
- extendedWaitUntil:
    visible:
      id: loginPasswordInput
    timeout: 15000
- tapOn:
    id: loginPasswordInput
- inputText: ${BRAINY_TEST_PASSWORD}
- tapOn:
    id: loginSubmit

# 3) El claim automatizado desemboca en /plan-ready (wizard visto y ruta final).
- extendedWaitUntil:
    visible:
      id: planReadyTitle
    timeout: 120000
- assertVisible:
    id: planReadyTitle
- assertVisible:
    id: planReadyCta