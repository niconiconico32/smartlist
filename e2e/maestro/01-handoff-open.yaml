# E2E handoff – apertura 1: abre el deep link, hace login si procede y verifica
# que se llega a /plan-ready. Los valores se inyectan por env (nunca en el repo).
#   BRAINY_E2E_OPEN_URL     deep link exacto a abrir (lo construye el runner)
#   BRAINY_TEST_EMAIL       email del usuario de prueba
#   BRAINY_TEST_PASSWORD    password del usuario de prueba
appId: com.brainyahdh.app
---
# 1) Abrir el link (brainy://claim?token=...&redeem_url=... o la rc-:// link)
- openLink: ${BRAINY_E2E_OPEN_URL}

# 2) Si el app pidió login (sin sesión real), entrar por email + contraseña.
#    El flujo es /login → "Tengo una Cuenta" → /login-social, y el enlace de
#    correo abre /login-existing, que ya muestra el formulario inline de email y
#    contraseña (no hay modal ni toggle que usar).
#    Tras un arranque en frío el bundler puede tardar mucho en mostrar la
#    pantalla 1, así que se espera loginStart con margen amplio.
- extendedWaitUntil:
    visible:
      id: loginStart
    timeout: 180000
- assertVisible:
    id: loginStart
- tapOn:
    id: loginHaveAccount
- extendedWaitUntil:
    visible:
      id: loginEmailOpen
    timeout: 20000
- tapOn:
    id: loginEmailOpen
- extendedWaitUntil:
    visible:
      id: loginExistingEmail
    timeout: 15000
- tapOn:
    id: loginExistingEmail
- inputText: ${BRAINY_TEST_EMAIL}
- tapOn:
    id: loginExistingPassword
- inputText: ${BRAINY_TEST_PASSWORD}
- tapOn:
    id: loginExistingSubmit

# 3) El claim automatizado desemboca en /plan-ready (wizard visto y ruta final).
- extendedWaitUntil:
    visible:
      id: planReadyTitle
    timeout: 120000
- assertVisible:
    id: planReadyTitle
- assertVisible:
    id: planReadyCta